<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{title}} — CorgCode</title>
    <link rel="icon" href="/pt-favicon.svg">
    <link rel="stylesheet" href="/app.css">
</head>
<body class="lab-login">
    <header class="login-nav">
        <a class="brand" href="/"><span class="brand-icon">C</span><span>CorgCode</span></a>
    </header>
    <main class="login-grid">
        <section class="panel login-card" aria-labelledby="form-title">
            <h1 id="form-title">{{title}}</h1>
            <!-- login-error -->
            <form method="post" action="{{action}}" class="login-form">
                <label>Имя пользователя<input name="name" autocomplete="username" required maxlength="64" autocapitalize="none" spellcheck="false"></label>
                <label>Пароль<input name="password" type="password" autocomplete="{{autocomplete}}" required maxlength="256" {{password-minlength}}></label>
                <button class="primary" type="submit">{{submit}}</button>
            </form>
            <p class="small"><a href="{{alternate-url}}">{{alternate-label}}</a></p>
            <p class="small"><a href="/demo/">Открыть публичное демо</a></p>
        </section>
    </main>
</body>
</html>
