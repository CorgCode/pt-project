<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>host2vec — карта хостов сети</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --panel2: #1c232d; --border: #2b333d;
    --fg: #e6edf3; --muted: #8b949e; --accent: #58a6ff; --warn: #f0883e;
    --danger: #f85149; --ok: #3fb950;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.45 -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
  header { display: flex; align-items: center; gap: 18px; padding: 10px 18px;
    background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header h1 small { color: var(--muted); font-weight: 400; }
  .stats { display: flex; gap: 16px; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
  .stats b { color: var(--fg); }
  .controls { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  .controls input, .controls select { background: var(--panel2); color: var(--fg);
    border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-size: 13px; }
  .btn { background: var(--panel2); color: var(--fg); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 13px; }
  .btn.active { border-color: var(--accent); color: var(--accent); }
  main { display: grid; grid-template-columns: 1fr 380px; gap: 0; height: calc(100vh - 52px); }
  #canvas-wrap { position: relative; overflow: hidden; }
  svg { width: 100%; height: 100%; display: block; }
  .node { cursor: pointer; transition: opacity .12s; }
  .node:hover { stroke: #fff; stroke-width: 1.5; }
  aside { border-left: 1px solid var(--border); background: var(--panel);
    overflow-y: auto; padding: 0; }
  .tabs { display: flex; border-bottom: 1px solid var(--border); position: sticky; top: 0;
    background: var(--panel); z-index: 2; }
  .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; color: var(--muted);
    border-bottom: 2px solid transparent; font-size: 13px; }
  .tab.active { color: var(--fg); border-bottom-color: var(--accent); }
  .pane { padding: 14px; display: none; }
  .pane.active { display: block; }
  .kv { display: flex; justify-content: space-between; padding: 3px 0; font-size: 13px; }
  .kv span:first-child { color: var(--muted); }
  .chip { display: inline-block; background: var(--panel2); border: 1px solid var(--border);
    border-radius: 12px; padding: 2px 9px; font-size: 12px; margin: 2px 3px 2px 0; }
  .section-title { font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); margin: 16px 0 8px; }
  .nb { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px;
    background: var(--panel2); cursor: pointer; }
  .nb:hover { border-color: var(--accent); }
  .nb-head { display: flex; justify-content: space-between; align-items: center; }
  .nb-head b { font-size: 13px; }
  .simbar { height: 5px; border-radius: 3px; background: var(--accent); margin: 5px 0; }
  .nb small { color: var(--muted); font-size: 11.5px; }
  .reasons { margin: 4px 0 0; padding-left: 16px; }
  .reasons li { font-size: 12px; color: var(--fg); margin: 1px 0; }
  .anom { border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; margin-bottom: 9px;
    background: var(--panel2); cursor: pointer; }
  .anom:hover { border-color: var(--warn); }
  .anom.real { border-left: 3px solid var(--danger); }
  .badge { font-size: 10.5px; padding: 1px 6px; border-radius: 10px; }
  .badge.gt { background: rgba(248,81,73,.18); color: var(--danger); border: 1px solid var(--danger); }
  .badge.an { background: rgba(240,136,62,.18); color: var(--warn); border: 1px solid var(--warn); }
  .traj { display: flex; gap: 3px; margin-top: 6px; }
  .traj .cell { width: 20px; height: 18px; border-radius: 3px; font-size: 10px;
    display: flex; align-items: center; justify-content: center; color: #0b0e13; font-weight: 600; }
  .legend { position: absolute; bottom: 10px; left: 10px; background: rgba(22,27,34,.9);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px;
    max-width: 260px; max-height: 40%; overflow:auto; }
  .legend .row { display: flex; align-items: center; gap: 6px; margin: 2px 0; cursor: pointer; }
  .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); padding: 30px 14px; text-align: center; }
  .link { color: var(--accent); cursor: pointer; }
  #tooltip { position: absolute; pointer-events: none; background: #000c; color: #fff;
    border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-size: 12px;
    display: none; z-index: 5; }
</style>
</head>
<body>
<header>
  <h1>host2vec <small>— векторное представление хостов по сетевым взаимодействиям</small></h1>
  <div class="stats" id="stats"></div>
  <div class="controls">
    <input id="search" placeholder="поиск хоста…" autocomplete="off" />
    <button class="btn active" id="by-cluster">по кластерам</button>
    <button class="btn" id="by-role">по ролям</button>
  </div>
</header>
<main>
  <div id="canvas-wrap">
    <svg id="scatter" viewBox="0 0 1000 800" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="legend" id="legend"></div>
    <div id="tooltip"></div>
  </div>
  <aside>
    <div class="tabs">
      <div class="tab active" data-pane="host">Хост</div>
      <div class="tab" data-pane="clusters">Кластеры</div>
      <div class="tab" data-pane="anomalies">Аномалии</div>
    </div>
    <div class="pane active" id="pane-host"><div class="empty">Выберите хост на карте,<br>чтобы увидеть профиль и похожие хосты.</div></div>
    <div class="pane" id="pane-clusters"></div>
    <div class="pane" id="pane-anomalies"></div>
  </aside>
</main>

<script>
const CLUSTER_COLORS = ["#58a6ff","#3fb950","#f0883e","#bc8cff","#f85149","#39c5cf",
  "#e3b341","#ff7b72","#7ee787","#d2a8ff","#79c0ff","#ffa657","#56d4dd","#f2cc60"];
const ROLE_COLORS = {
  workstation:"#58a6ff", web_server:"#3fb950", db_server:"#f0883e",
  dns_server:"#bc8cff", domain_controller:"#f85149", file_server:"#39c5cf",
  mail_server:"#e3b341", proxy:"#ff7b72", external:"#6e7681", unknown:"#6e7681"
};
const state = { hosts:[], byId:{}, colorBy:"cluster", selected:null, clusters:[], anomalies:[],
  xdom:[0,1], ydom:[0,1] };
const W=1000,H=800,PAD=40;
const svg = document.getElementById("scatter");
const tooltip = document.getElementById("tooltip");

function fx(x){ const [a,b]=state.xdom; return PAD + (x-a)/((b-a)||1)*(W-2*PAD); }
function fy(y){ const [a,b]=state.ydom; return H-PAD - (y-a)/((b-a)||1)*(H-2*PAD); }
function colorOf(h){ return state.colorBy==="cluster"
  ? CLUSTER_COLORS[h.cluster % CLUSTER_COLORS.length]
  : (ROLE_COLORS[h.role]||"#6e7681"); }

async function boot(){
  const [sum,hosts,clusters,anoms] = await Promise.all([
    fetch("/api/summary").then(r=>r.json()),
    fetch("/api/hosts").then(r=>r.json()),
    fetch("/api/clusters").then(r=>r.json()),
    fetch("/api/anomalies").then(r=>r.json()),
  ]);
  state.hosts = hosts.hosts; state.clusters = clusters.clusters; state.anomalies = anoms.anomalies;
  state.hosts.forEach(h=> state.byId[h.device]=h);
  state.xdom = extent(state.hosts.map(h=>h.x));
  state.ydom = extent(state.hosts.map(h=>h.y));
  renderStats(sum); renderLegend(); renderScatter(); renderClusters(); renderAnomalies();
}
function extent(a){ return [Math.min(...a), Math.max(...a)]; }

function renderStats(s){
  const ev = s.evaluation[s.best_method] || {};
  const sil = ev.silhouette!=null ? ev.silhouette.toFixed(3) : "—";
  const ari = ev.ari!=null ? ev.ari.toFixed(3) : null;
  document.getElementById("stats").innerHTML =
    `<div>хостов: <b>${s.n_devices}</b></div>`+
    `<div>окон: <b>${s.n_windows}</b></div>`+
    `<div>кластеров: <b>${s.best_k}</b></div>`+
    `<div>метод: <b>${s.best_method}</b></div>`+
    `<div>silhouette: <b>${sil}</b></div>`+
    (ari!=null?`<div>ARI к ролям: <b>${ari}</b></div>`:"")+
    `<div>аномалий: <b style="color:var(--danger)">${s.n_anomalies_flagged}</b></div>`;
}

function renderLegend(){
  const el = document.getElementById("legend");
  let items;
  if(state.colorBy==="cluster"){
    items = state.clusters.map(c=>({label:`Кластер ${c.cluster} · ${c.dominant_role} (${c.size})`,
      color:CLUSTER_COLORS[c.cluster%CLUSTER_COLORS.length]}));
  } else {
    const roles=[...new Set(state.hosts.map(h=>h.role))];
    items = roles.map(r=>({label:r, color:ROLE_COLORS[r]||"#6e7681"}));
  }
  el.innerHTML = `<div class="muted" style="margin-bottom:4px">раскраска: ${state.colorBy==="cluster"?"кластеры":"истинные роли"}</div>`+
    items.map(i=>`<div class="row"><span class="dot" style="background:${i.color}"></span>${i.label}</div>`).join("");
}

function renderScatter(){
  let edges="";
  if(state.selected){
    const h=state.byId[state.selected];
    (h.neighbors||[]).forEach(n=>{ const t=state.byId[n.device]; if(t)
      edges+=`<line x1="${fx(h.x)}" y1="${fy(h.y)}" x2="${fx(t.x)}" y2="${fy(t.y)}"
        stroke="var(--accent)" stroke-width="${0.5+2.5*n.similarity}" opacity="0.5"/>`; });
  }
  const nbSet = new Set(state.selected ? (state.byId[state.selected].neighbors||[]).map(n=>n.device) : []);
  const circles = state.hosts.map(h=>{
    const sel = h.device===state.selected;
    const near = nbSet.has(h.device);
    const dim = state.selected && !sel && !near ? 0.25 : 1;
    const r = sel?9:(near?6.5:4.5);
    const stroke = sel?"#fff":(near?"var(--accent)":"none");
    return `<circle class="node" data-id="${h.device}" cx="${fx(h.x)}" cy="${fy(h.y)}" r="${r}"
      fill="${colorOf(h)}" opacity="${dim}" stroke="${stroke}" stroke-width="${sel?2:(near?1.5:0)}"/>`;
  }).join("");
  svg.innerHTML = edges + circles;
  svg.querySelectorAll(".node").forEach(c=>{
    c.addEventListener("click", ()=> selectHost(c.dataset.id));
    c.addEventListener("mousemove", e=> showTip(e, c.dataset.id));
    c.addEventListener("mouseleave", ()=> tooltip.style.display="none");
  });
}

function showTip(e, id){
  const h=state.byId[id];
  tooltip.style.display="block";
  const wrap=document.getElementById("canvas-wrap").getBoundingClientRect();
  tooltip.style.left=(e.clientX-wrap.left+12)+"px";
  tooltip.style.top=(e.clientY-wrap.top+12)+"px";
  tooltip.innerHTML=`<b>${h.device}</b><br>роль: ${h.role}<br>кластер: ${h.cluster}`+
    `<br>потоков: ${h.stats.total_flows}`;
}

function selectHost(id){
  state.selected=id; renderScatter(); renderHostPane(); activateTab("host");
}

function renderHostPane(){
  const h=state.byId[state.selected]; const el=document.getElementById("pane-host");
  if(!h){ el.innerHTML='<div class="empty">Выберите хост.</div>'; return; }
  const nbrs=(h.neighbors||[]).map(n=>`
    <div class="nb" onclick="selectHost('${n.device}')">
      <div class="nb-head"><b>${n.device}</b><small>${(n.similarity*100).toFixed(1)}%${n.same_cluster?" · тот же кластер":""}</small></div>
      <div class="simbar" style="width:${Math.max(4,n.similarity*100).toFixed(0)}%"></div>
      <ul class="reasons">${(n.reasons||[]).map(r=>`<li>${r}</li>`).join("")}</ul>
    </div>`).join("");
  el.innerHTML=`
    <div style="display:flex;align-items:center;gap:8px">
      <span class="dot" style="width:14px;height:14px;background:${colorOf(h)}"></span>
      <h2 style="margin:0;font-size:17px">${h.device}</h2></div>
    <div class="kv"><span>истинная роль</span><span>${h.role}</span></div>
    <div class="kv"><span>кластер</span><span>${h.cluster}</span></div>
    <div class="kv"><span>потоков</span><span>${h.stats.total_flows}</span></div>
    <div class="kv"><span>входящих партнёров</span><span>${h.stats.in_peers}</span></div>
    <div class="kv"><span>исходящих партнёров</span><span>${h.stats.out_peers}</span></div>
    <div class="kv"><span>доля инициаций</span><span>${h.stats.initiated_ratio}</span></div>
    <div class="section-title">Характерное поведение</div>
    <div>${(h.top_features||[]).map(f=>`<span class="chip">${f}</span>`).join("")||'<span class="muted">—</span>'}</div>
    <div class="section-title">Похожие хосты — и почему</div>
    ${nbrs||'<div class="muted">нет данных</div>'}`;
}

function renderClusters(){
  const el=document.getElementById("pane-clusters");
  el.innerHTML=state.clusters.map(c=>`
    <div class="nb" style="cursor:default">
      <div class="nb-head">
        <b><span class="dot" style="background:${CLUSTER_COLORS[c.cluster%CLUSTER_COLORS.length]}"></span>
        Кластер ${c.cluster}</b><small>${c.size} хостов</small></div>
      <div style="margin:4px 0"><small class="muted">преобладает:</small> ${c.dominant_role}</div>
      <div>${c.profile.map(p=>`<span class="chip">${p}</span>`).join("")}</div>
    </div>`).join("");
}

function renderAnomalies(){
  const el=document.getElementById("pane-anomalies");
  if(!state.anomalies.length){ el.innerHTML='<div class="empty">Аномалии не обнаружены.</div>'; return; }
  el.innerHTML=`<div class="muted" style="margin-bottom:10px">Хосты с резкой сменой поведения и редкими переходами между кластерами по окнам.</div>`+
    state.anomalies.map(a=>{
    const traj=a.trajectory.map(c=>`<div class="cell" style="background:${CLUSTER_COLORS[c%CLUSTER_COLORS.length]}">${c}</div>`).join("");
    return `<div class="anom ${a.is_anomaly?'real':''}" onclick="selectHost('${a.device}')">
      <div class="nb-head"><b>${a.device}</b>
        <span>${a.is_anomaly?'<span class="badge an">аномалия</span>':''}
        ${a.ground_truth?'<span class="badge gt">подтв.</span>':''}</span></div>
      <div class="kv"><span>score</span><span><b>${a.score}</b> (drift z=${a.z_drift}, rarity=${a.rarity})</span></div>
      <div class="kv"><span>переход (окно ${a.window})</span><span>кластер ${a.from_cluster} → ${a.to_cluster}</span></div>
      <div class="muted" style="font-size:11px;margin-top:4px">траектория кластеров по окнам:</div>
      <div class="traj">${traj}</div>
    </div>`;
  }).join("");
}

function activateTab(name){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.pane===name));
  document.querySelectorAll(".pane").forEach(p=>p.classList.toggle("active",p.id===("pane-"+name)));
}
document.querySelectorAll(".tab").forEach(t=> t.addEventListener("click",()=>activateTab(t.dataset.pane)));
document.getElementById("by-cluster").addEventListener("click",()=>{ state.colorBy="cluster";
  document.getElementById("by-cluster").classList.add("active");
  document.getElementById("by-role").classList.remove("active"); renderLegend(); renderScatter(); });
document.getElementById("by-role").addEventListener("click",()=>{ state.colorBy="role";
  document.getElementById("by-role").classList.add("active");
  document.getElementById("by-cluster").classList.remove("active"); renderLegend(); renderScatter(); });
document.getElementById("search").addEventListener("keydown",e=>{
  if(e.key==="Enter"){ const q=e.target.value.trim().toLowerCase();
    const hit=state.hosts.find(h=>h.device.toLowerCase().includes(q)); if(hit) selectHost(hit.device); }});

boot().catch(err=>{ document.body.innerHTML=
  `<div style="padding:40px;color:#f85149">Не удалось загрузить данные: ${err}.<br><br>
  Сгенерируйте данные и запустите пайплайн:<br>
  <code>python -m hostembed.datagen --out data &amp;&amp; python -m hostembed.pipeline</code></div>`; });
</script>
</body>
</html>
