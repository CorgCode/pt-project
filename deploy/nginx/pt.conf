# Include in the http context. Render once for each hostname.
limit_req_zone $binary_remote_addr zone=@PREFIX@_auth:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=@PREFIX@_api:2m rate=10r/s;
log_format @PREFIX@_json escape=json '{"at":"$time_iso8601","method":"$request_method","status":$status,"seconds":$request_time}';

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name @HOST@;
    ssl_certificate @CERT@;
    ssl_certificate_key @CERT_KEY@;
    root @STATIC_ROOT@;
    access_log /var/log/nginx/@PREFIX@.log @PREFIX@_json;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    client_max_body_size 8m;
    limit_req_status 429;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 65s;

    location ~ (^|/)\. { return 404; }
    location /internal/ { return 404; }
    location /api/ {
        limit_req zone=@PREFIX@_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:@API_PORT@;
    }
    location ~ ^/lab/(login|register)/$ {
        limit_req zone=@PREFIX@_auth burst=8 nodelay;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:@API_PORT@;
    }
    location = /lab/ { proxy_pass http://127.0.0.1:@API_PORT@; }
    location = /lab/logout/ { proxy_pass http://127.0.0.1:@API_PORT@; }
    location = /lab { return 308 /lab/; }
    location = /lab/index.html { return 308 /lab/; }
    location = /lab/workspace { return 308 /lab/; }
    location = /lab/workspace/ { return 308 /lab/; }
    location = /work { return 308 /lab/; }
    location = /work/ { return 308 /lab/; }
    location = /contact { return 308 /model/; }
    location = /contact/ { return 308 /model/; }
    location = /demo { return 308 /demo/; }
    location = /demo/ { try_files /lab/index.html =404; }
    location / { try_files $uri $uri/ =404; }
}
