global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']
scrape_configs:
  - job_name: pt-production
    metrics_path: /internal/metrics
    authorization:
      credentials_file: /etc/prometheus/secrets/pt-production
    static_configs:
      - targets: ['127.0.0.1:8945']
  - job_name: pt-staging
    metrics_path: /internal/metrics
    authorization:
      credentials_file: /etc/prometheus/secrets/pt-staging
    static_configs:
      - targets: ['127.0.0.1:8947']
