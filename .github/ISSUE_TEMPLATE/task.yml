name: Задача
description: Любая задача команды
title: "Область: что сделать"
body:
  - type: textarea
    id: goal
    attributes:
      label: Зачем
      placeholder: Одна-две фразы.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Что сделать
      placeholder: |
        - [ ] Шаг 1
        - [ ] Шаг 2
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Готово, когда
      placeholder: Как понять, что задача закрыта.
    validations:
      required: true
