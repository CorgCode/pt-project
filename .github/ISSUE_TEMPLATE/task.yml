name: Задача
description: Новая задача для команды
title: "Область: коротко, что сделать"
body:
  - type: textarea
    id: goal
    attributes:
      label: Зачем
      description: Какую проблему решаем и что получим в итоге.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Что сделать
      placeholder: |
        - [ ] Шаг 1
        - [ ] Шаг 2
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Готово, когда
      placeholder: |
        - [ ] Код и тесты в PR, PR связан с этим issue
        - [ ] Результат описан в README
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Ссылки и заметки
      description: Статьи, данные, ограничения.
