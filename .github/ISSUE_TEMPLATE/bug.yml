name: Ошибка
description: Что-то сломалось
title: "Ошибка: <коротко>"
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: Что случилось
      placeholder: Команда, которую запускали, и текст ошибки.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что ожидали
    validations:
      required: true
