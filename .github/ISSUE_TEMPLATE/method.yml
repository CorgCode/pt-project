name: Новый метод
description: Метод построения эмбеддингов хостов
title: "Методы: <название>"
labels: ["type: feature", "area: embeddings"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Идея метода
      placeholder: Что делает, ссылка на статью.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Готово, когда
      value: |
        - [ ] Эмбеддинг лежит в `scoreboard/submissions/<метод>/embeddings.csv` (или код в `benchmark/methods/`)
        - [ ] Метод появился в таблице `scoreboard/README.md`
        - [ ] Короткая заметка: параметры и как запустить
    validations:
      required: true
