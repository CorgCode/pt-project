name: Benchmark validation

on:
  pull_request:
    paths:
      - "benchmark/**"
      - "evaluation/**"
      - "pipeline/**"
      - "experiments/**"
      - "app/**"
      - "docs/**"
      - "submissions/**"
      - ".github/workflows/benchmark.yml"
  push:
    branches:
      - main
    paths:
      - "benchmark/**"
      - "evaluation/**"
      - "pipeline/**"
      - "experiments/**"
      - "app/**"
      - "docs/**"
      - "submissions/**"

jobs:
  validate-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Validate GitHub Pages visualizations and snapshot data
        run: python docs/check_pages.py

      - name: Browser smoke test GitHub Pages (no upload required)
        run: |
          python -m pip install playwright
          python -m playwright install chromium
          python docs/browser_check.py


      - name: Validate example submission
        run: python benchmark/validate_submission.py benchmark/example_embeddings.csv

      - name: Run evaluation tests
        run: python -m pytest -q evaluation benchmark app pipeline experiments

      - name: Pipeline smoke test (synthetic LANL-format fixture)
        run: |
          python -m pipeline.fixtures --output-dir "$RUNNER_TEMP/fixture" --n-hosts 100
          python -m pipeline.prepare describe --netflow "$RUNNER_TEMP"/fixture/netflow_day-*.bz2 > /dev/null
          python -m pipeline.prepare run --netflow "$RUNNER_TEMP"/fixture/netflow_day-*.bz2 \
            --config pipeline/example_config.json --output-dir "$RUNNER_TEMP/processed"
          python -m pipeline.reference --processed-dir "$RUNNER_TEMP/processed" --output-dir "$RUNNER_TEMP/pipeline_reference"

      - name: End-to-end experiment smoke test (synthetic fixture)
        run: python -m experiments.end_to_end --fixture --n-hosts 120 --bootstrap 20 --workdir "$RUNNER_TEMP/e2e"

      - name: Generate and validate baseline embeddings (synthetic reference)
        run: |
          python -m benchmark.baselines.make_synthetic_reference --output-dir "$RUNNER_TEMP/reference"
          python -m benchmark.baselines.run_all --reference-dir "$RUNNER_TEMP/reference" \
            --out-dir "$RUNNER_TEMP/baselines" --results-dir "$RUNNER_TEMP/results" --evaluate
          for file in "$RUNNER_TEMP"/baselines/*/embeddings.csv; do
            python benchmark/validate_submission.py "$file"
          done
          python benchmark/build_leaderboard.py --results-dir "$RUNNER_TEMP/results" --output "$RUNNER_TEMP/leaderboard.csv"

      - name: Validate team submissions
        shell: bash
        run: |
          shopt -s nullglob
          shopt -s globstar
          files=(submissions/**/embeddings.csv)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No team submissions found yet."
            exit 0
          fi
          for file in "${files[@]}"; do
            echo "Validating $file"
            python benchmark/validate_submission.py "$file"
          done
