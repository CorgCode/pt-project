name: Benchmark validation

on:
  pull_request:
    paths:
      - "benchmark/**"
      - "submissions/**"
      - ".github/workflows/benchmark.yml"
  push:
    branches:
      - main
    paths:
      - "benchmark/**"
      - "submissions/**"

jobs:
  validate-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas

      - name: Validate example submission
        run: python benchmark/validate_submission.py benchmark/example_embeddings.csv

      - name: Validate team submissions
        shell: bash
        run: |
          shopt -s nullglob
          files=(submissions/*/embeddings.csv)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No team submissions found yet."
            exit 0
          fi
          for file in "${files[@]}"; do
            echo "Validating $file"
            python benchmark/validate_submission.py "$file"
          done
