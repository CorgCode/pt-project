name: Benchmark validation

on:
  pull_request:
    paths:
      - "methods/**"
      - "evaluation/**"
      - "pipeline/**"
      - "experiments/**"
      - "app/**"
      - "scoreboard/**"
      - ".github/workflows/benchmark.yml"
  push:
    branches:
      - main
    paths:
      - "methods/**"
      - "evaluation/**"
      - "pipeline/**"
      - "experiments/**"
      - "app/**"
      - "scoreboard/**"

jobs:
  validate-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Validate example submission
        run: python -m evaluation.validate methods/example_embeddings.csv

      - name: Run evaluation tests
        run: python -m pytest -q evaluation methods app pipeline experiments

      - name: Pipeline smoke test (synthetic LANL-format fixture)
        run: |
          python -m pipeline.fixtures --output-dir "$RUNNER_TEMP/fixture" --n-hosts 100
          python -m pipeline.prepare describe --netflow "$RUNNER_TEMP"/fixture/netflow_day-*.bz2 > /dev/null
          python -m pipeline.prepare run --netflow "$RUNNER_TEMP"/fixture/netflow_day-*.bz2 \
            --config pipeline/example_config.json --output-dir "$RUNNER_TEMP/processed"
          python -m pipeline.reference --processed-dir "$RUNNER_TEMP/processed" --output-dir "$RUNNER_TEMP/pipeline_reference"

      - name: End-to-end experiment smoke test (synthetic fixture)
        run: python -m experiments.end_to_end --fixture --n-hosts 120 --bootstrap 20 --methods all --fast-methods --workdir "$RUNNER_TEMP/e2e"

      - name: Generate and validate baseline embeddings (synthetic reference)
        run: |
          python -m methods.baselines.make_synthetic_reference --output-dir "$RUNNER_TEMP/reference"
          python -m methods.baselines.run_all --reference-dir "$RUNNER_TEMP/reference" \
            --out-dir "$RUNNER_TEMP/baselines" --results-dir "$RUNNER_TEMP/results" --evaluate
          for file in "$RUNNER_TEMP"/baselines/*/embeddings.csv; do
            python -m evaluation.validate "$file"
          done
          python -m evaluation.scoreboard --results-dir "$RUNNER_TEMP/results" --output "$RUNNER_TEMP/scoreboard"

      - name: Scoreboard is consistent with its submissions
        run: |
          python -m evaluation.submit --all
          git diff --stat --exit-code -- scoreboard/results scoreboard/README.md scoreboard/scoreboard.csv \
            || echo "::warning::scoreboard отличается от отправок — его обновит workflow Scoreboard"
