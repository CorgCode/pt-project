name: PT Telegram delivery check
on:
  push:
    branches: [pt-network-production]
    paths: [.github/workflows/pt-telegram-check.yml]
permissions:
  contents: read
jobs:
  telegram:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 deploy/monitoring/telegram.py notify 'PT Network Telegram delivery test.'
        env:
          PT_TELEGRAM_BOT_TOKEN: ${{ secrets.PT_TELEGRAM_BOT_TOKEN }}
          PT_TELEGRAM_CHAT_ID: ${{ secrets.PT_TELEGRAM_CHAT_ID }}

      - name: Encrypt the VPS handoff
        env:
          PT_TELEGRAM_BOT_TOKEN: ${{ secrets.PT_TELEGRAM_BOT_TOKEN }}
        run: |
          umask 077
          cat > handoff-public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAuB6UKAn78ezOIeOM4t2l
          ggEBhKiYZfGKMtwu+ikcbfSc2XnwcRiOGvB6mh4xeZImgHYi8OtpAnY26LK31xDj
          Xp3/LSnYa2NWqXybyrRgA70D0hO+1kPgM081H9MscHiZSL7cumBwOntMcWAGomRR
          LmQi+hyTe3C6UjXosfwkuRJLdhwE8+jw8ggqMpANb/KjKALOjVTra1IMjOk33HN5
          HGu34epfNE7E30WHgrNEPkZsN3U1n9yXbnfIQyOD0DJNZkZ9ug8k7mIXktr0lHyR
          Hk3KfiT6LwW2v4oudOVbmO7lMr8dCmG1tltUxPNcYPlWcBGzsKw15sTvinsVu/PX
          pCHrHa+fE52RxJAnaBmbdCNBe85oT7z2ej06ALBKJ/09599OPv7nKgl7Chgk20tb
          NnQVM0jLykQkqkEZUn90/svNuTbCXMsfrPA/Ytt7TcOkPnbrPdRFTW269kfUcvRX
          oF/tdsKBN4sypJUHMrurX1h8jJU5rCYYvHomd+Jl1kwhAgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          test -n "$PT_TELEGRAM_BOT_TOKEN"
          printf '%s' "$PT_TELEGRAM_BOT_TOKEN" | openssl pkeyutl -encrypt -pubin -inkey handoff-public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -out telegram-handoff.bin
      - uses: actions/upload-artifact@v4
        with:
          name: pt-telegram-handoff
          path: telegram-handoff.bin
          retention-days: 1
