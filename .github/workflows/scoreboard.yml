name: Scoreboard

# Кто-то закоммитил эмбеддинг в scoreboard/submissions/<метод>/ в своей ветке —
# оцениваем его и дописываем результат и таблицу прямо в эту ветку (и в её PR).
on:
  push:
    branches-ignore: [main]
    paths:
      - "scoreboard/submissions/**"
  pull_request:
    paths:
      - "scoreboard/submissions/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scoreboard-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Score new submissions
        run: python -m evaluation.submit --all

      - name: Show the table in the job summary
        run: cat scoreboard/README.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit results to the PR
        run: |
          if [ -n "$(git status --porcelain scoreboard)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scoreboard
            git commit -m "scoreboard: оценка новых отправок"
            git push
          else
            echo "Таблица уже актуальна."
          fi
