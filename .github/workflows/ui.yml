name: Laboratory UI

on:
  pull_request:
    paths:
      - "app/operator/**"
      - "deploy/requirements.txt"
      - "noomo-ui/**"
      - "ui-prototype/vendor/**"
      - ".github/workflows/ui.yml"
  push:
    branches: [main]
    paths:
      - "app/operator/**"
      - "deploy/requirements.txt"
      - "noomo-ui/**"
      - "ui-prototype/vendor/**"
      - ".github/workflows/ui.yml"

permissions:
  contents: read

concurrency:
  group: lab-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: noomo-ui/package-lock.json
      - run: python -m pip install -r deploy/requirements.txt pytest httpx
      - run: python -m pytest -q --confcutdir=app/operator app/operator/test_server.py app/operator/test_web.py
      - run: npm ci
        working-directory: noomo-ui
      - run: npm test
        working-directory: noomo-ui
      - run: npx playwright install --with-deps chromium
        working-directory: noomo-ui
      - run: npx playwright test
        working-directory: noomo-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-browser-results
          path: noomo-ui/test-results/
